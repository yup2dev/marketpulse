<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>

a{color:#8FB8FF}a:hover{color:#B9D3FF}

</helmet>
<div style="min-height: 100vh; background: #08080A; color: #E8E8EA; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; font-size: 13px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 13 8 13 11 6 14 18 17 11 21 11"></polyline></svg>

      <span style="font-size: 15px; font-weight: 700">MarketPulse</span>

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
      <input type="search" placeholder="종목 · 지표 검색" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #E8E8EA; font: inherit">
      <span style="font-size: 11px; color: #8E8E96">Ctrl K</span>

    <span style="width: 28px; height: 28px; border-radius: 50%; background: #2B3A55; color: #CFE0FF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">김</span>

  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <nav aria-label="Main" style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; background: #0B0B0C; border-right: 1px solid #1C1C1F">

          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.icon }}"></path></svg>

    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">

        <span style="font-size: 15px; font-weight: 700">Apple <span style="color: #8E8E96; font-weight: 500; font-size: 13px">AAPL</span></span>
        <span style="font-size: 20px; font-weight: 700">$350.34</span>
        <span style="font-weight: 700; color: {{ up }}">+7.97 (+2.33%)</span>
        <span style="margin-left: auto; display: flex; gap: 6px">

          </button>

            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>

      </div>
      <nav aria-label="Stock sections" style="display: flex; gap: 4px; padding: 8px 12px 0">

        <a href="#" style="height: 32px; padding: 0 12px; border-radius: 6px; color: #9C9CA3; display: flex; align-items: center; text-decoration: none">종목정보</a>

        <a href="Institution.dc.html" style="height: 32px; padding: 0 12px; border-radius: 6px; color: #9C9CA3; display: flex; align-items: center; text-decoration: none">기관 보유</a>
      </nav>

      <main class="g12" style="flex: 1; padding: 8px; align-content: start">
        <section aria-label="Chart" style="grid-column: span 8; height: 480px; background: #121214; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden">

              <button type="button" style="height: 28px; padding: 0 8px; border-radius: 6px; border: 0; background: transparent; color: #9C9CA3; font: inherit; font-size: 12px">월</button>

            </span>
            <button type="button" aria-label="차트 위젯 닫기" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #8E8E96; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
          </div>
          <svg viewBox="0 0 800 380" preserveAspectRatio="none" style="flex: 1; width: 100%; min-height: 0; display: block" role="img" aria-label="AAPL daily candles with volume">
            <line x1="0" y1="80" x2="800" y2="80" stroke="#18181B"></line>
            <line x1="0" y1="160" x2="800" y2="160" stroke="#18181B"></line>
            <line x1="0" y1="240" x2="800" y2="240" stroke="#18181B"></line>
            <line x1="0" y1="300" x2="800" y2="300" stroke="#1E1E22"></line>
            <sc-for list="{{ candles }}" as="c" hint-placeholder-count="30">
              <line x1="{{ c.x }}" y1="{{ c.hi }}" x2="{{ c.x }}" y2="{{ c.lo }}" stroke="{{ c.color }}" stroke-width="1"></line>
              <rect x="{{ c.bx }}" y="{{ c.top }}" width="14" height="{{ c.h }}" fill="{{ c.color }}"></rect>
              <rect x="{{ c.bx }}" y="{{ c.vy }}" width="14" height="{{ c.vh }}" fill="{{ c.color }}" opacity="0.4"></rect>
            </sc-for>
            <polyline points="{{ ma }}" fill="none" stroke="#E0A845" stroke-width="1.4"></polyline>
          </svg>
        </section>

        <section aria-label="Top holders" style="grid-column: span 4; height: 480px; background: #121214; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px; flex-shrink: 0">
            <span style="width: 20px; color: #55555C; text-align: center" aria-hidden="true">⠿</span>
            <span style="height: 28px; padding: 0 10px; border-radius: 6px; background: #1E1E22; display: flex; align-items: center; font-size: 12px; font-weight: 700">기관 보유</span>
            <button type="button" aria-label="Add tab" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #8E8E96; font-size: 16px">+</button>
            <span style="margin-left: auto; font-size: 11px; color: #6E6E76">2026-06-30</span>
            <button type="button" aria-label="기관 보유 위젯 닫기" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #8E8E96; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
          </div>
          <div style="flex: 1; overflow: auto">
            <sc-for list="{{ holders }}" as="h" hint-placeholder-count="8">
              <div style="height: 52px; padding: 0 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px">
                <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ h.name }}</span><span style="font-weight: 600">{{ h.value }}</span></div>
                <span style="height: 4px; border-radius: 2px; background: #1E1E22; overflow: hidden"><span style="display: block; height: 4px; width: {{ h.w }}; background: #3182F6"></span></span>
              </div>
            </sc-for>
          </div>
        </section>

        <section aria-label="News and filings" style="grid-column: span 8; height: 320px; background: #121214; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px; flex-shrink: 0">
            <span style="width: 20px; color: #55555C; text-align: center" aria-hidden="true">⠿</span>
            <span style="height: 28px; padding: 0 10px; border-radius: 6px; background: #1E1E22; display: flex; align-items: center; font-size: 12px; font-weight: 700">뉴스 · 공시</span>
            <button type="button" aria-label="Add tab" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #8E8E96; font-size: 16px">+</button>
            <button type="button" aria-label="뉴스 공시 위젯 닫기" style="margin-left: auto; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #8E8E96; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
          </div>
          <div style="flex: 1; overflow: auto">
            <sc-for list="{{ feed }}" as="f" hint-placeholder-count="7">
              <a href="StockNews.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 16px; text-decoration: none; color: #E8E8EA">
                <span style="width: 40px; text-align: center; padding: 2px 0; border-radius: 6px; background: {{ f.tagBg }}; color: {{ f.tagFg }}; font-size: 11px; font-weight: 700">{{ f.tag }}</span>
                <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ f.title }}</span>
                <span style="width: 64px; text-align: right; font-size: 12px; color: #8E8E96">{{ f.when }}</span>
              </a>
            </sc-for>
          </div>
        </section>

        <section aria-label="Dividends" style="grid-column: span 4; height: 320px; background: #121214; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px; flex-shrink: 0">
            <span style="width: 20px; color: #55555C; text-align: center" aria-hidden="true">⠿</span>
            <span style="height: 28px; padding: 0 10px; border-radius: 6px; background: #1E1E22; display: flex; align-items: center; font-size: 12px; font-weight: 700">배당</span>
            <span style="margin-left: auto; font-size: 11px; color: #6E6E76">분기 · USD</span>
            <button type="button" aria-label="배당 위젯 닫기" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #8E8E96; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
          </div>
          <div style="flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 12px; padding: 8px 16px 12px">
            <sc-for list="{{ dividends }}" as="d" hint-placeholder-count="4">
              <div style="flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px">
                <span style="font-size: 12px; font-weight: 700">{{ d.amount }}</span>
                <span style="width: 100%; height: {{ d.h }}; border-radius: 6px 6px 0 0; background: #3182F6"></span>
                <span style="font-size: 11px; color: #8E8E96">{{ d.label }}</span>
              </div>
            </sc-for>
          </div>
        </section>
      </main>
    </div>
  </div>

  <footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; height: 32px; padding: 0 16px; background: #0B0B0C; border-top: 1px solid #1C1C1F; font-size: 12px; color: #8E8E96">
    <span>투자 유의사항</span>
    <span style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 16px">
      <sc-for list="{{ footer }}" as="f" hint-placeholder-count="3">
        <span>{{ f.name }} <span style="color: #E8E8EA; font-weight: 600">{{ f.price }}</span> <span style="color: {{ f.color }}; font-weight: 600">{{ f.chg }}</span></span>
      </sc-for>
    </span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"updown":{"editor":"enum","options":["kr","us"],"default":"kr","section":"Price colors"},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const kr = (this.props.updown ?? 'kr') !== 'us';
    const UP = kr ? '#F04452' : '#1DB37A';
    const DOWN = kr ? '#3182F6' : '#F04452';
    const tone = (v) => (v > 0 ? UP : v < 0 ? DOWN : '#9C9CA3');
    const pct = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + '%';
    const closes = [230, 222, 226, 214, 218, 206, 210, 200, 204, 190, 196, 182, 188, 200, 192, 180, 174, 182, 168, 176, 162, 170, 156, 150, 158, 142, 148, 134, 126, 118];
    const candles = closes.map((c, i) => {
      const o = i === 0 ? 234 : closes[i - 1];
      const rising = c < o;
      const x = 14 + i * 26;
      const top = Math.min(o, c), h = Math.max(3, Math.abs(o - c));
      const vol = 18 + ((i * 37) % 52);
      return { x: x + 7, bx: x, top, h, hi: top - 8, lo: top + h + 8, color: rising ? UP : DOWN, vy: 380 - vol, vh: vol };
    });
    const ma = closes.map((c, i) => {
      const s = closes.slice(Math.max(0, i - 4), i + 1);
      return (21 + i * 26) + ',' + (s.reduce((a, b) => a + b, 0) / s.length + 4).toFixed(1);
    }).join(' ');
    const holders = [
      ['Blackrock Inc.', '$407.94B', 407.94], ['Vanguard Capital Mgmt', '$336.42B', 336.42], ['State Street Corp.', '$215.76B', 215.76],
      ['Geode Capital Mgmt', '$131.62B', 131.62], ['Vanguard Portfolio Mgmt', '$117.21B', 117.21], ['FMR, LLC', '$114.13B', 114.13],
      ['Morgan Stanley', '$85.11B', 85.11], ['JPMorgan Chase &amp; Co', '$80.25B', 80.25],
    ].map(([name, value, v]) => ({ name: name.replace('&amp;', '&'), value, w: Math.round((v / 407.94) * 100) + '%' }));
    const feed = [
      ['공시', '10-K · Periodic Financial Reports', '11.03'], ['공시', '8-K · Corporate Changes & Voting Matters', '11.02'],
      ['뉴스', 'Arm and Qualcomm Lead Mobile Chip Design. 1 Stock Is the Better Buy.', '6시간 전'],
      ['뉴스', 'Tech Sell-Off: The 1 "Magnificent Seven" Stock I’d Buy and the 1 I’d Avoid', '6시간 전'],
      ['뉴스', 'This Is the Best-Performing Magnificent Seven Stock of 2026. Is It Still a Buy?', '20시간 전'],
      ['공시', '8-K/A · Corporate Changes & Voting Matters', '09.01'], ['공시', '10-Q · Periodic Financial Reports', '07.31'],
    ].map(([tag, title, when]) => ({ tag, title, when, tagBg: tag === '공시' ? '#1F2533' : '#1C1C20', tagFg: tag === '공시' ? '#8FB8FF' : '#C9C9CF' }));
    const dividends = [['25.11', 0.26], ['26.02', 0.26], ['26.05', 0.27], ['26.08', 0.27]]
      .map(([label, v]) => ({ label, amount: '$' + v.toFixed(2), h: Math.round((v / 0.27) * 85) + '%' }));
    const ICON = {
      home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', stock: 'M4 19V5M4 19h16M8 15l3-4 3 2 5-6',
      macro: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18',
      cal: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4', port: 'M4 7h16v12H4zM9 7V5h6v2M4 12h16', screen: 'M4 6h16M7 12h10M10 18h4',
      quant: 'M5 19L19 5M7 7h.01M17 17h.01M4 12h3M17 12h3', bt: 'M4 18l5-6 4 3 7-9M4 4v16h16',
    };
    const rail = [
      ['home', '홈', 'Main.dc.html'], ['stock', '종목', '#'], ['macro', '매크로', 'MacroDetail.dc.html'], ['cal', '캘린더', '#'],
      ['port', '내 자산', '#'], ['screen', '스크리너', '#'], ['quant', '퀀트', '#'], ['bt', '백테스트', '#'],
    ].map(([k, label, href], i) => ({ icon: ICON[k], label, href, fg: i === 1 ? '#FFFFFF' : '#8E8E96', bg: i === 1 ? '#1C1C20' : 'transparent' }));
    const footer = [['KOSPI', '5,018.85', -0.80], ['KOSDAQ', '638.97', -0.82], ['S&P 500', '7,520.4', 1.89]]
      .map(([name, price, c]) => ({ name, price, chg: pct(c), color: tone(c) }));
    return { up: UP, candles, ma, holders, feed, dividends, rail, footer };
  }
}
</script>
</body>
</html>
