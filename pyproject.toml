# 루트 설정 — 도구(pytest/mypy) 설정만 모은다.
#
# [project] / [build-system] 섹션은 일부러 두지 않는다. 이 저장소의 루트는 설치 가능한
# 패키지가 아니며, data_fetcher/ 와 index_analyzer/ 가 각자 poetry pyproject 를 갖고 있다.
# 여기에 [project] 를 추가하면 pip 가 루트를 패키지로 취급해 배포가 꼬인다.
#
# 의존성은 배포 단위별 requirements 파일에 있다 (루트 requirements.txt 는 그것들을 모은 것):
#   MarketpulseFetcher/requirements.txt · MarketpulseWeb/requirements.txt (Docker)
#   MarketpulseBatch/requirements.txt · requirements-dev.txt — CI 는 루트 파일로 전부 설치한다.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "MarketpulseFetcher/data_fetcher/tests"]
# 패키지는 최상위 폴더 3개(Web·Batch·Fetcher) 아래에 있다 — 테스트는 전부 import 경로에 넣는다.
# (실행 진입점은 각자 필요한 폴더만 넣는다. 경계는 tests/test_module_boundaries.py 가 검사)
# (main.py 의 sys.path 조작에 의존하지 않기 위해 명시한다)
pythonpath = [".", "MarketpulseFetcher", "MarketpulseBatch", "MarketpulseWeb"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: 외부 네트워크가 필요한 테스트 (기본 CI에서는 제외)",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# 기존 코드가 타입 힌트를 부분적으로만 갖고 있어 아직 전면 적용하지 않는다.
# 새 모듈부터 파일 단위로 strict 를 켜 나간다.
follow_imports = "silent"
