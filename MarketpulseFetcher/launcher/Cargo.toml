# MarketPulse Fetcher 런처 — Python 런타임 + data_fetcher 를 품은 단일 실행파일.
#
# 직접 cargo build 하지 말고 `python MarketpulseFetcher/build/build.py` 로 빌드한다.
# build.py 가 페이로드(zip)를 만든 뒤 MP_PAYLOAD / MP_PAYLOAD_ID 환경변수로 넘겨준다.
[package]
name = "marketpulse-fetcher"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "MarketPulseFetcher"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
open = "5.4.5"
tao = "0.37.2"
tray-icon = "0.26.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
winreg = "0.56.0"

[build-dependencies]
png = "0.18.1"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
