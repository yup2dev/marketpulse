<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .grp  { fill: none; stroke: #333; stroke-width: 1.4; stroke-dasharray: 2 3; }
      .comp { fill: #cfe2f3; stroke: #6f93c4; stroke-width: 1.2; }
      .ext  { fill: #d9ead3; stroke: #7fa86a; stroke-width: 1.2; }
      .db   { fill: #ececec; stroke: #555; stroke-width: 1.2; }
      .ln   { fill: none; stroke: #222; stroke-width: 1.3; marker-end: url(#ah); }
      .ln2  { fill: none; stroke: #222; stroke-width: 1.3; marker-start: url(#ah); marker-end: url(#ah); }
      text  { fill: #222; }
      .t    { font-size: 13px; text-anchor: middle; }
      .s    { font-size: 11px; text-anchor: middle; fill: #444; }
      .gt   { font-size: 14px; font-weight: bold; text-anchor: middle; }
      .lb   { font-size: 11px; fill: #444; }
    </style>
  </defs>

  <rect width="1200" height="740" fill="#ffffff"/>

  <g transform="translate(180,0)">
    <!-- 외곽 -->
    <rect x="20" y="20" width="780" height="700" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="40" y="52" font-size="24">MarketPulse</text>

    <!-- ── Web Frontend ── -->
    <rect class="grp" x="40" y="70" width="300" height="135" rx="18"/>
    <text class="gt" x="190" y="92">Web Frontend (Vercel)</text>
    <rect class="comp" x="60" y="102" width="260" height="34"/>
    <text class="t" x="190" y="124">React + Vite · 위젯 대시보드</text>
    <rect class="comp" x="60" y="150" width="260" height="34"/>
    <text class="t" x="190" y="172">apiClient — JWT Bearer · refresh</text>
    <path class="ln" d="M190,136 V150"/>

    <!-- Frontend → Backend -->
    <path class="ln2" d="M320,167 H400"/>
    <text class="lb" x="360" y="160" text-anchor="middle">HTTPS · WSS</text>

    <!-- ── Backend ── -->
    <rect class="grp" x="380" y="110" width="400" height="380" rx="18"/>
    <text class="gt" x="580" y="134">Backend (FastAPI · Lightsail Docker)</text>
    <rect class="comp" x="400" y="150" width="360" height="34"/>
    <text class="t" x="580" y="172">auth_gate — 인증 (deny-by-default)</text>
    <rect class="comp" x="400" y="200" width="360" height="34"/>
    <text class="t" x="580" y="222">API Routes — /api/data · stock · macro · portfolio …</text>
    <rect class="comp" x="400" y="250" width="360" height="40"/>
    <text class="t" x="580" y="267">QueryExecutor</text>
    <text class="s" x="580" y="283">캐시(SWR) · 서킷브레이커 · 실행 위치 분기</text>
    <path class="ln" d="M580,184 V200"/>
    <path class="ln" d="M580,234 V250"/>

    <!-- Redis -->
    <path class="db" d="M470,330 v60 a45,10 0 0 0 90,0 v-60"/>
    <ellipse class="db" cx="515" cy="330" rx="45" ry="10"/>
    <text class="t" x="515" y="365">Redis</text>
    <text class="s" x="515" y="381">캐시</text>
    <path class="ln2" d="M515,290 V320"/>

    <!-- SQLite -->
    <path class="db" d="M590,330 v70 a70,10 0 0 0 140,0 v-70"/>
    <ellipse class="db" cx="660" cy="330" rx="70" ry="10"/>
    <text class="t" x="660" y="361">SQLite DB</text>
    <text class="s" x="660" y="377">적재 데이터</text>
    <text class="s" x="660" y="392">사용자 키 (Fernet)</text>
    <path class="ln2" d="M660,290 V320"/>

    <!-- /ws/fetcher -->
    <rect class="ext" x="345" y="345" width="100" height="30"/>
    <text class="t" x="395" y="365">/ws/fetcher</text>
    <path class="ln2" d="M420,290 V345"/>
    <text class="lb" x="426" y="322">위임</text>

    <!-- /api/ingest -->
    <rect class="ext" x="410" y="475" width="100" height="30"/>
    <text class="t" x="460" y="495">/api/ingest</text>
    <path class="ln" d="M460,475 V440 H660 V412"/>

    <!-- ── Local Fetcher ── -->
    <rect class="grp" x="40" y="280" width="300" height="170" rx="18"/>
    <text class="gt" x="190" y="302">Local Fetcher (사용자 PC · exe)</text>
    <rect class="comp" x="60" y="318" width="230" height="46"/>
    <text class="t" x="175" y="337">data_fetcher.app</text>
    <text class="s" x="175" y="355">REST 127.0.0.1:8765 · WS 워커</text>
    <rect class="comp" x="60" y="395" width="230" height="34"/>
    <text class="t" x="175" y="417">Rust 런처 — 트레이 · 내장 Python</text>
    <path class="ln" d="M175,395 V364"/>

    <!-- 토큰 전달 -->
    <path class="ln" d="M175,184 V318"/>
    <text class="lb" x="181" y="246">POST /user-token</text>
    <text class="lb" x="181" y="260">(로그인 토큰)</text>

    <!-- Fetcher ↔ /ws/fetcher -->
    <path class="ln2" d="M290,360 H345"/>
    <text class="lb" x="317" y="353" text-anchor="middle">WSS</text>

    <!-- ── Batch ── -->
    <rect class="grp" x="380" y="530" width="400" height="175" rx="18"/>
    <text class="gt" x="580" y="554">Batch (로컬 PC)</text>
    <rect class="comp" x="400" y="575" width="120" height="34"/>
    <text class="t" x="460" y="597">sync_db_to_cloud</text>
    <rect class="comp" x="620" y="575" width="140" height="40"/>
    <text class="t" x="690" y="592">수집 jobs</text>
    <text class="s" x="690" y="608">stk_stbd · fx · 13F · 뉴스</text>
    <path class="db" d="M520,635 v45 a45,9 0 0 0 90,0 v-45"/>
    <ellipse class="db" cx="565" cy="635" rx="45" ry="9"/>
    <text class="t" x="565" y="665">로컬</text>
    <text class="t" x="565" y="681">SQLite</text>
    <rect class="comp" x="640" y="652" width="120" height="34"/>
    <text class="t" x="700" y="674">작업 스케줄러 07:30</text>
    <path class="ln" d="M700,652 V615"/>
    <path class="ln" d="M620,595 H565 V626"/>
    <path class="ln" d="M520,662 H460 V609"/>
    <path class="ln" d="M460,575 V505"/>
    <text class="lb" x="466" y="522">HTTP bulk upsert</text>

    <!-- ── 외부 소스 ── -->
    <rect class="ext" x="-160" y="318" width="150" height="46"/>
    <text class="t" x="-85" y="337">Yahoo Finance</text>
    <text class="s" x="-85" y="355">SEC 13F 원본</text>
    <path class="ln" d="M-10,341 H60"/>

    <rect class="ext" x="840" y="248" width="160" height="44"/>
    <text class="t" x="920" y="266">외부 데이터 API</text>
    <text class="s" x="920" y="283">FRED · FMP · SEC · KIS …</text>
    <path class="ln" d="M840,270 H760"/>

    <rect class="ext" x="840" y="575" width="160" height="40"/>
    <text class="t" x="920" y="592">Yahoo · SEC · FMP</text>
    <text class="s" x="920" y="608">뉴스 사이트</text>
    <path class="ln" d="M840,595 H760"/>
  </g>
</svg>
