name: Test

# PR과 모든 브랜치 push에서 실행하고, 배포 워크플로가 workflow_call 로 재사용한다.
# (배포는 이 워크플로가 통과해야만 진행된다 — deploy-backend.yml 의 needs: test)
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 문법 오류(E9)와 정의되지 않은 이름(F821~F823)만 잡는다 — 스타일은 게이트하지 않는다.
      # 기존 코드베이스가 커서 전면 린트를 바로 강제하면 배포가 멈춘다.
      # 스타일 통일(ruff 도입)은 별도 작업으로 분리한다.
      #
      # 흔히 쓰는 `--select=...,F82` 는 접두 매칭이라 F824(죽은 global/nonlocal 선언)까지
      # 걸린다. 실제 버그가 아니므로 F821/F822/F823 만 명시한다.
      - name: Lint (errors only)
        run: |
          flake8 app data_fetcher index_analyzer scripts \
            --count --select=E9,F63,F7,F821,F822,F823 --show-source --statistics

      - name: Run tests
        run: pytest

      # ── 프론트엔드 ──────────────────────────────────────────────────────────
      # eslint 설정이 깨져 있어(플러그인 flat config 키 오류) 그동안 CI에 넣지 못했다.
      # 에러 0을 만든 뒤 게이트로 추가한다. 경고(react-refresh / exhaustive-deps)는
      # 아직 남아 있으므로 --max-warnings 는 걸지 않는다 — 에러만 배포를 막는다.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: app/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build
