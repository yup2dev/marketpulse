name: Release Fetcher

# git tag v1.0.0 && git push origin v1.0.0 으로 트리거
#
# 2026-09-21: Tauri 데스크톱 앱을 제거하고 독립 실행 Fetcher만 릴리스한다.
# 2026-11-09: PyInstaller 를 걷어내고 Rust 런처(MarketpulseFetcher/launcher) 단일 exe 로 교체.
# 프론트엔드는 Vercel, 백엔드는 Docker로 배포되므로 여기서 만드는 산출물은
# 사용자가 자기 PC에서 실행하는 Fetcher 하나뿐이다.
#
# 예전에는 tauri-action 이 GitHub Release 를 만들고 그 뒤에 Fetcher 를 붙였다.
# Tauri 를 걷어내면 릴리스를 만들 주체가 사라지므로 softprops/action-gh-release 로
# 직접 만든다(이미 있으면 에셋만 추가 — 매트릭스 두 잡이 같은 릴리스에 올린다).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # GitHub Release 생성 권한

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target_triple: x86_64-pc-windows-msvc
          - platform: macos-latest
            target_triple: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # 빌드 도구만 준비한다. 번들되는 Python 런타임은 build.py 가 uv 로 받고,
      # 의존성은 MarketpulseFetcher/build/requirements-fetcher.txt 로 그 안에 설치한다.
      - name: Setup Python (build.py 실행용)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            MarketpulseFetcher/launcher/target
          key: cargo-${{ matrix.target_triple }}-${{ hashFiles('MarketpulseFetcher/launcher/Cargo.lock') }}

      # ── 독립 실행 Fetcher 빌드 ────────────────────────────────────────────
      # 사용자가 자기 PC에서 실행해 /ws/fetcher 워커 풀에 합류시키는 실행파일.
      # Rust 런처가 내장 Python 런타임 + data_fetcher 를 품은 단일 exe(.app).
      - name: Build standalone Fetcher (Rust launcher)
        shell: bash
        run: |
          python MarketpulseFetcher/build/build.py --no-desktop
          DIST=MarketpulseFetcher/build/dist
          mkdir -p release-assets
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "$DIST/MarketPulseFetcher.exe" "release-assets/MarketPulseFetcher-${{ matrix.target_triple }}.exe"
          else
            # .app 번들 → zip (ditto가 번들 메타데이터를 보존)
            ditto -c -k --keepParent "$DIST/MarketPulseFetcher.app" "release-assets/MarketPulseFetcher-${{ matrix.target_triple }}.zip"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'MarketPulse Fetcher ${{ github.ref_name }}'
          body: |
            ## MarketPulse Fetcher ${{ github.ref_name }}

            웹앱에서 Yahoo 등 로컬 실행이 필요한 데이터를 쓰려면 이 Fetcher를
            내 PC에서 실행하세요.

            ### 다운로드
            - **Windows**: `MarketPulseFetcher-x86_64-pc-windows-msvc.exe`
            - **macOS (Apple Silicon)**: `MarketPulseFetcher-aarch64-apple-darwin.zip`

            ### 사용
            실행하면 트레이에 상주하며, 웹앱에 로그인하면 토큰이 자동 전달되어
            클라우드 워커 풀에 합류합니다.
          files: release-assets/*
          draft: false
          prerelease: false
